openapi: 3.0.0
info:
  title: TaskFlow API
  description: >-
    REST API for TaskFlow todo application. All routes are
    fronted by a proxy (`src/proxy.ts`) that enforces
    rate limits and rejects cross-site state-changing
    requests (CSRF) with 403.
  version: 1.0.0
  contact:
    name: TaskFlow Team
    email: support@taskflow.app
servers:
  - url: http://localhost:3000/api
    description: Local development server
  - url: https://api.taskflow.app
    description: Production server
paths:
  /export:
    get:
      summary: Export all application data
      description: Download complete application data as JSON backup
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: JSON file download
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                    example: 1
                  exportedAt:
                    type: string
                    format: date-time
                    example: 2026-10-04T14:10:56.296Z
                  lists:
                    type: array
                    items:
                      $ref: '#/components/schemas/List'
                  labels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Label'
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  taskLabels:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskLabel'
                  taskAttachments:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskAttachment'
                  taskReminders:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskReminder'
                  taskDependencies:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskDependency'
                  taskLogs:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskLog'
        '500':
          description: Export failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to export data
  /import:
    post:
      summary: Import application data
      description: Restore application data from JSON backup
      parameters:
        - name: onConflict
          in: query
          description: How to handle records that already exist
          schema:
            type: string
            enum: [skip, replace]
            default: skip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportData'
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Import successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No file provided
        '500':
          description: Import failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errors:
                    type: array
                    items:
                      type: string
  /templates:
    get:
      summary: Get all task templates
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: List of templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskTemplate'
    post:
      summary: Create a new task template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskTemplate'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: Template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  template:
                    $ref: '#/components/schemas/TaskTemplate'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Name is required
  /tasks:
    get:
      summary: Get tasks with optional filters
      parameters:
        - name: listId
          in: query
          schema:
            type: string
        - name: labelId
          in: query
          schema:
            type: string
        - name: view
          in: query
          schema:
            type: string
            enum: [today, next7, upcoming, all]
        - name: completed
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTask'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
    patch:
      summary: Toggle, update, or delete a task
      description: The task is addressed by id in the request body; there is no per-id route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTask'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Action applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/ValidationError'
  /tasks/{id}/dependencies:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a task's dependencies
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Blocking and blocked tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDependencies'
    post:
      summary: Add a dependency to a task
      description: The path id is the blocked task; the body supplies the blocking task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTaskDependency'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: Dependency added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Invalid request
  /tasks/{id}/dependencies/{blockingId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: blockingId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Remove a dependency from a task
      description: The path id is the blocked task; blockingId is the task that blocks it
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Dependency removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Invalid request
  /tasks/{id}/can-complete:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Check whether a task can be completed
      description: A task cannot be completed while an unfinished "blocks" dependency exists
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Completion status and any blocking tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanCompleteResponse'
  /push/send:
    post:
      summary: Send push notification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
                  format: uri
                keys:
                  type: object
                  properties:
                    p256dh:
                      type: string
                    auth:
                      type: string
                payload:
                  type: object
                  properties:
                    title:
                      type: string
                    body:
                      type: string
                    icon:
                      type: string
                    data:
                      type: object
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Notification sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: Unauthorized - Invalid API key
        '400':
          description: Invalid request
  /reminders:
    get:
      summary: Deliver due task reminders
      description: >-
        Background reminder sweep. Returns the
        reminders whose time has come (for
        incomplete tasks) and marks them sent, so
        the next sweep will not repeat them. The
        client polls this every minute and surfaces
        the results as toasts.
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: The reminders that were just delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        taskId:
                          type: string
                        taskName:
                          type: string
                        reminderTime:
                          type: string
                          format: date-time
        '500':
          description: Failed to process reminders
  /presence:
    get:
      summary: List who is present
      description: >-
        Active clients in a workspace, most
        recent first. Heartbeats older than
        60s are reaped before the list is
        returned. The client polls this every
        10s to render presence indicators.
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          description: Missing workspaceId parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '200':
          description: Active clients in the workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  presence:
                    type: array
                    items:
                      type: object
                      properties:
                        clientId:
                          type: string
                        name:
                          type: string
                        lastSeen:
                          type: integer
                          format: int64
    post:
      summary: Send a presence heartbeat
      description: >-
        Register (or refresh) this client's
        presence in a workspace. Browsers send
        one every 15s while a workspace is
        open; the entry expires 60s after the
        last heartbeat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - workspaceId
                - clientId
                - name
              properties:
                workspaceId:
                  type: string
                clientId:
                  type: string
                name:
                  type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/ValidationError'
        '200':
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '500':
          description: Failed to record presence
  /labels:
    get:
      summary: Get all labels
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: List of labels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Label'
    post:
      summary: Create a new label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLabel'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: Label created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        '400':
          description: Invalid request
    patch:
      summary: Update or delete a label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelPatch'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Updated label, or success confirmation for delete
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Label'
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: true
        '400':
          description: Invalid request
        '404':
          description: Label not found
  /lists:
    get:
      summary: Get all lists
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: List of lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/List'
    post:
      summary: Create a new list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewList'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: List created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '400':
          description: Invalid request
    patch:
      summary: Update or delete a list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListPatch'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: List updated or deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Invalid request
  /task-logs:
    get:
      summary: Get the task activity log
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: List of task logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskLog'
  /search:
    get:
      summary: Search tasks
      parameters:
        - name: q
          in: query
          required: false
          description: Search query (minimum 2 characters; returns an empty array if omitted or too short)
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Matching tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
  /workflows:
    get:
      summary: Get all workflows
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workflow'
    post:
      summary: Create a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workflow'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
    put:
      summary: Update a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workflow'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Workflow updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '404':
          description: Workflow not found
    delete:
      summary: Delete a workflow
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Workflow deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Missing workflow ID
        '404':
          description: Workflow not found
  /workflows/connectors:
    post:
      summary: Deliver a workflow connector message
      description: >-
        Server-side delivery for workflow connectors (github,
        slack, email). The workflow engine runs in the browser
        and has no access to secrets, so it posts the message
        here; this route reads credentials from the environment
        and performs the delivery. It fails closed: an unknown
        connector, or one that is not configured, is rejected
        before any network call is made.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - connector
                - title
                - body
              properties:
                connector:
                  type: string
                  minLength: 1
                  description: Connector identifier (github, slack or email)
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
                body:
                  type: string
                  maxLength: 10000
                taskName:
                  type: string
                  maxLength: 500
                taskUrl:
                  type: string
                  format: uri
      responses:
        '200':
          description: Message delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
        '400':
          description: >-
            Invalid request data, unknown connector, or the
            connector is not configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
        '502':
          description: Delivery failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
  /webhooks:
    get:
      summary: Get all webhooks
      description: The signing secret is not included in the list view
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: List of webhooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhook'
    post:
      summary: Create a webhook
      description: The signing secret is returned only on creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWebhook'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Webhook created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  webhook:
                    $ref: '#/components/schemas/Webhook'
        '400':
          description: Invalid request
  /webhooks/trigger:
    post:
      summary: Trigger webhooks for an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
              properties:
                event:
                  type: string
                  enum: [task.created, task.updated, task.completed, task.deleted, list.created, list.updated, list.deleted]
                data:
                  type: object
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Webhooks triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Invalid event
  /webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a specific webhook
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Webhook details (includes the signing secret)
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook:
                    $ref: '#/components/schemas/Webhook'
        '404':
          description: Webhook not found
    patch:
      summary: Update a webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPatch'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Webhook updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  webhook:
                    $ref: '#/components/schemas/Webhook'
        '404':
          description: Webhook not found
    delete:
      summary: Delete a webhook
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Webhook deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '404':
          description: Webhook not found
  /auth/google:
    get:
      summary: Start Google Calendar OAuth
      description: Redirects to Google's OAuth consent screen with PKCE (S256). Sets the httpOnly cookies `oauth_state` and `oauth_code_verifier` (10-minute expiry) for verification on callback.
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '302':
          description: Redirect to Google's OAuth consent screen
        '500':
          description: Google OAuth not configured (GOOGLE_CLIENT_ID missing)
  /auth/google/callback:
    get:
      summary: Google OAuth callback
      description: Validates the state cookie, exchanges the authorization code for tokens, and stores them in the httpOnly `google_calendar_tokens` cookie (30-day expiry). Every error path redirects to /settings with an `error` query parameter.
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '302':
          description: Redirect to /settings (?calendar=connected on success, ?error=... otherwise)
  /calendar/status:
    get:
      summary: Get Google Calendar connection status
      description: Reads the `google_calendar_tokens` cookie, transparently refreshing it when expired (when a refresh token and Google client credentials are available). Returns connected=false when there is nothing valid to authenticate with.
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Connection status, calendar list, and current selection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarStatus'
  /calendar/sync:
    get:
      summary: Sync tasks with Google Calendar
      description: >-
        Pushes incomplete upcoming tasks to the user's primary calendar for the
        next 90 days. Events TaskFlow creates are keyed by the task id
        (prefixed with `task-`) so re-syncing maps to the existing event;
        tasks imported from Google update the source event they came from
        (`source_event_id`). With `pull=true`, Google events that are not yet
        in TaskFlow are imported as tasks (linked back via `source_event_id`
        so the next sync updates rather than duplicates them). The tokens
        cookie is transparently refreshed when expired (when a refresh token
        and Google client credentials are available).
      parameters:
        - name: pull
          in: query
          description: Also import Google events that are not yet in TaskFlow
          schema:
            type: boolean
            default: false
        - name: listId
          in: query
          description: List to import pulled events into (defaults to the first list)
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarSyncResult'
        '401':
          description: Not authenticated (no valid tokens cookie)
        '404':
          description: No calendars found
        '500':
          description: Sync failed
    post:
      summary: Trigger a manual sync
      description: Delegates to GET. Accepts the same `pull` and `listId` query parameters.
      parameters:
        - name: pull
          in: query
          description: Also import Google events that are not yet in TaskFlow
          schema:
            type: boolean
            default: false
        - name: listId
          in: query
          description: List to import pulled events into (defaults to the first list)
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarSyncResult'
        '401':
          description: Not authenticated (no valid tokens cookie)
        '404':
          description: No calendars found
        '500':
          description: Sync failed
  /calendar/disconnect:
    post:
      summary: Disconnect Google Calendar
      description: Clears the `google_calendar_tokens`, `calendar-selected`, and `calendar-last-sync` cookies.
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
  /calendar/events/import:
    post:
      summary: Import a single Google Calendar event
      description: >-
        Imports one Google Calendar event into TaskFlow as a task
        linked to it via `source_event_id`, so a later sync updates
        the event instead of duplicating it. Requires Google auth
        (a valid tokens cookie). When `listId` is omitted the event
        is imported into the first list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventId
                - calendarId
              properties:
                eventId:
                  type: string
                  minLength: 1
                calendarId:
                  type: string
                  minLength: 1
                listId:
                  type: string
                  minLength: 1
                  description: List to import into (defaults to the first list)
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Event imported as a task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
        '400':
          description: eventId and calendarId are required
        '401':
          description: Not authenticated (no valid tokens cookie)
        '404':
          description: No list to import into
        '500':
          description: Import failed
  /push/subscribe:
    post:
      summary: Register a push subscription
      description: Persists the subscription in the database, keyed by endpoint. Re-registering the same endpoint rotates its keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscription'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Subscription saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  subscription:
                    $ref: '#/components/schemas/StoredPushSubscription'
        '400':
          description: Invalid subscription
        '500':
          description: Failed to subscribe
  /push/unsubscribe:
    post:
      summary: Remove a push subscription
      description: Deletes the subscription from the database. Unsubscribing an unknown endpoint is still a success (idempotent).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushEndpoint'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Unsubscription processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  removed:
                    type: boolean
                    description: Whether a stored subscription was actually removed
        '400':
          description: Invalid endpoint
        '500':
          description: Failed to unsubscribe
  /share:
    get:
      summary: List a list's share links
      parameters:
        - name: listId
          in: query
          required: true
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Share links for the list
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShareLinkSummary'
        '400':
          description: Missing listId parameter
        '500':
          description: Failed to get share links
    post:
      summary: Create a share link for a list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewShareLink'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Share link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  shareLink:
                    $ref: '#/components/schemas/ShareLinkResponse'
        '400':
          description: Missing or invalid fields
        '404':
          description: List not found
        '500':
          description: Failed to create share link
  /share/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a shared list's contents
      description: Returns the list and its tasks. View-permission links expose only incomplete tasks; comment and edit links expose all tasks.
      parameters:
        - name: password
          in: query
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Shared list data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedListData'
        '404':
          description: Invalid, expired, or revoked share link (or wrong password)
        '500':
          description: Failed to load shared list
    delete:
      summary: Revoke a share link
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Share link revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '404':
          description: Share link not found
        '500':
          description: Failed to revoke share link
  /share/{token}/access:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Record a share-link access
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Access recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '500':
          description: Failed to record access
  /workspaces:
    get:
      summary: List workspaces
      description: Returns one workspace when `workspaceId` is given, the workspaces for a user when `userId` is given, or every workspace otherwise.
      parameters:
        - name: workspaceId
          in: query
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Workspace(s)
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    $ref: '#/components/schemas/Workspace'
                  workspaces:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
        '404':
          description: Workspace not found
        '500':
          description: Failed to get workspaces
    post:
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWorkspace'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Workspace created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  workspace:
                    $ref: '#/components/schemas/Workspace'
        '400':
          description: Missing required fields
        '500':
          description: Failed to create workspace
    patch:
      summary: Update a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspacePatch'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Workspace updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  workspace:
                    $ref: '#/components/schemas/Workspace'
        '400':
          description: Missing workspaceId
        '404':
          description: Workspace not found
        '500':
          description: Failed to update workspace
    delete:
      summary: Delete a workspace
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Workspace deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Missing workspaceId
        '404':
          description: Workspace not found
        '500':
          description: Failed to delete workspace
  /workspaces/{workspaceId}/members:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List workspace members
      description: Returns one member when `userId` is given, or every member otherwise.
      parameters:
        - name: userId
          in: query
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Member(s)
          content:
            application/json:
              schema:
                type: object
                properties:
                  member:
                    $ref: '#/components/schemas/WorkspaceMember'
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceMember'
        '404':
          description: Member not found
        '500':
          description: Failed to get members
    post:
      summary: Add a member to a workspace
      description: When `requestedBy` is supplied, the caller must be able to manage the workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWorkspaceMember'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  member:
                    $ref: '#/components/schemas/WorkspaceMember'
        '400':
          description: Missing required fields
        '403':
          description: Insufficient permissions to add members
        '500':
          description: Failed to add member
    patch:
      summary: Change a member's role
      description: The owner's role cannot be changed. When `requestedBy` is supplied, the caller must be able to manage the workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceMemberRole'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  member:
                    $ref: '#/components/schemas/WorkspaceMember'
        '400':
          description: Missing fields, invalid role, or cannot change owner role
        '403':
          description: Insufficient permissions to change roles
        '404':
          description: Member not found
        '500':
          description: Failed to update member role
    delete:
      summary: Remove a member from a workspace
      description: The owner cannot be removed. When `requestedBy` differs from `userId`, the caller must be able to manage the workspace.
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: requestedBy
          in: query
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Missing userId, or cannot remove workspace owner
        '403':
          description: Insufficient permissions to remove members
        '404':
          description: Member not found
        '500':
          description: Failed to remove member
  /workspaces/{workspaceId}/activity:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get workspace activity
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Recent workspace activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceActivity'
        '500':
          description: Failed to get activity
  /workspaces/{workspaceId}/events:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Stream workspace activity (SSE)
      description: >-
        Real-time channel for collaboration
        events in a workspace: member changes,
        invitations, comments, and workspace
        creation are pushed as JSON `data:`
        frames the moment they are logged. Any
        SSE client can subscribe; a heartbeat
        comment frame keeps proxies from
        closing idle streams. The stream ends
        when the client disconnects.
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Server-sent event stream of workspace activity
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  One `data: <json>` frame per
                  WorkspaceActivity event, with
                  `: heartbeat` comment frames
                  every 25s.
  /workspaces/{workspaceId}/comments:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List comments on a task
      parameters:
        - name: taskId
          in: query
          required: true
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Task comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskComment'
        '400':
          description: Missing taskId
        '500':
          description: Failed to get comments
    post:
      summary: Add a comment to a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTaskComment'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Comment added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  comment:
                    $ref: '#/components/schemas/TaskComment'
        '400':
          description: Missing required fields
        '500':
          description: Failed to add comment
    patch:
      summary: Update a comment
      description: Only the comment's author (`userId`) may update it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCommentPatch'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Comment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  comment:
                    $ref: '#/components/schemas/TaskComment'
        '400':
          description: Missing required fields
        '404':
          description: Comment not found or unauthorized
        '500':
          description: Failed to update comment
    delete:
      summary: Delete a comment
      description: Only the comment's author (`userId`) may delete it.
      parameters:
        - name: commentId
          in: query
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Comment deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Missing commentId or userId
        '404':
          description: Comment not found or unauthorized
        '500':
          description: Failed to delete comment
  /workspaces/{workspaceId}/invitations:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List workspace invitations
      description: Returns one invitation when `token` is given, or every invitation for the workspace otherwise.
      parameters:
        - name: token
          in: query
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Invitation(s)
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation:
                    $ref: '#/components/schemas/WorkspaceInvitation'
                  invitations:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceInvitation'
        '404':
          description: Invitation not found
        '500':
          description: Failed to get invitations
    post:
      summary: Send a workspace invitation
      description: The inviter must be allowed to invite (owner or admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWorkspaceInvitation'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Invitation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  invitation:
                    $ref: '#/components/schemas/WorkspaceInvitation'
        '400':
          description: Missing required fields
        '403':
          description: Insufficient permissions to send invitations
        '500':
          description: Failed to create invitation
    delete:
      summary: Revoke a workspace invitation
      parameters:
        - name: invitationId
          in: query
          required: true
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Invitation revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Missing invitationId
        '404':
          description: Invitation not found
        '500':
          description: Failed to revoke invitation
  /invitations:
    get:
      summary: Look up an invitation by token
      description: Used by the invitation acceptance page before the workspace id is known.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Invitation
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation:
                    $ref: '#/components/schemas/WorkspaceInvitation'
        '400':
          description: Missing token parameter
        '404':
          description: Invitation not found
        '500':
          description: Failed to get invitation
  /invitations/accept:
    post:
      summary: Accept a workspace invitation
      description: Adds the user to the workspace with the invited role and marks the invitation accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  workspace:
                    $ref: '#/components/schemas/Workspace'
        '400':
          description: Missing required fields
        '404':
          description: Invalid, used, or expired invitation, or workspace not found
        '500':
          description: Failed to accept invitation
  /invitations/decline:
    post:
      summary: Decline a workspace invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationDeclineRequest'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Invitation declined
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Missing token
        '404':
          description: Invitation not found
        '500':
          description: Failed to decline invitation
components:
  schemas:
    List:
      type: object
      properties:
        id:
          type: string
          example: inbox
        name:
          type: string
          example: Inbox
        color:
          type: string
          example: '#6366f1'
        emoji:
          type: string
          example: 📥
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        task_count:
          type: integer
          example: 5
        incomplete_count:
          type: integer
          example: 3
    Label:
      type: object
      properties:
        id:
          type: string
          example: work
        name:
          type: string
          example: Work
        color:
          type: string
          example: '#10b981'
        icon:
          type: string
          example: 🏷️
        created_at:
          type: string
          format: date-time
    Task:
      type: object
      properties:
        id:
          type: string
          example: task-123
        name:
          type: string
          example: Complete project proposal
        description:
          type: string
          nullable: true
          example: Finish the Q4 project proposal document
        date:
          type: string
          format: date
          nullable: true
          example: 2026-10-15
        deadline:
          type: string
          format: date-time
          nullable: true
          example: 2026-10-14T17:00:00Z
        estimate:
          type: integer
          nullable: true
          example: 120
        actual_time:
          type: integer
          example: 0
        priority:
          type: string
          enum: [high, medium, low, none]
          example: high
        recurring:
          type: string
          enum: [every_day, every_week, every_weekday, every_month, every_year, custom]
          nullable: true
        list_id:
          type: string
          nullable: true
        parent_task_id:
          type: string
          nullable: true
        completed:
          type: boolean
          example: false
        completed_at:
          type: string
          format: date-time
          nullable: true
        position:
          type: integer
          example: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        sub_tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/TaskAttachment'
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/TaskReminder'
        logs:
          type: array
          items:
            $ref: '#/components/schemas/TaskLog'
        list:
          $ref: '#/components/schemas/List'
        assignee_id:
          type: string
          nullable: true
          description: Workspace member the task is assigned to
        assignee:
          $ref: '#/components/schemas/WorkspaceMember'
    NewTask:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Complete project proposal
        description:
          type: string
          nullable: true
        date:
          type: string
          format: date
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true
        estimate:
          type: integer
          nullable: true
        priority:
          type: string
          enum: [high, medium, low, none]
          default: none
        recurring:
          type: string
          enum: [every_day, every_week, every_weekday, every_month, every_year, custom]
          nullable: true
        list_id:
          type: string
          nullable: true
        parent_task_id:
          type: string
          nullable: true
        completed:
          type: boolean
          default: false
        completed_at:
          type: string
          format: date-time
          nullable: true
        position:
          type: integer
          default: 0
        assignee_id:
          type: string
          nullable: true
    PartialTask:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        date:
          type: string
          format: date

  responses:
    TooManyRequests:
      description: >-
        Rate limit exceeded. All API routes are throttled by the proxy:
        a default of 120 requests/minute per client IP, with stricter
        limits on push delivery, Google OAuth, share creation, and
        webhook triggering.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Too many requests
      headers:
        Retry-After:
          description: Seconds until the rate limit window resets
          schema:
            type: integer
        X-RateLimit-Limit:
          description: Request limit for the current window
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Requests remaining in the current window
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Epoch seconds when the current window resets
          schema:
            type: integer
    ValidationError:
      description: >-
        Invalid request data. Routes that accept JSON bodies
        validate them centrally (`src/lib/validation.ts`);
        `details` carries the zod-formatted field errors, or
        null when the body was not valid JSON.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Invalid request data
              details:
                type: object
                nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT